
{% extends "base.html" %}

{% block title %}Confirm Delete | ResiCare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 600px;">
        <div class="card-body p-4 p-md-5">
            <i class="bi bi-exclamation-triangle text-danger display-5"></i>
            <h1 class="h4 fw-bold mt-3">Delete "{{ item.title }}"?</h1>
            <p class="text-secondary">This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url cancel_url %}" class="btn btn-light">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
